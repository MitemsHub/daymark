<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ink ground: the dark card reads clearly against light browser chrome -->
  <rect width="32" height="32" rx="7" fill="#16302b"/>

  <!-- The daymark beacon: rust triangle on its paper baseline -->
  <path d="M16 6.5 L25 22.5 H7 Z" fill="#b3491d"/>
  <rect x="6.5" y="24" width="19" height="2.6" rx="1.3" fill="#f7f5f0"/>

  <!-- The light it marks: a small paper dot above the apex -->
  <circle cx="16" cy="4.6" r="1.6" fill="#f7f5f0"/>
</svg>
