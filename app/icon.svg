<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Paper card with a soft corner, like the app ground -->
  <rect width="32" height="32" rx="6" fill="#f7f5f0"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="5.5" fill="none" stroke="#d9d4c8"/>

  <!-- Calendar header band: the ruled top of a wall calendar -->
  <rect x="4" y="4" width="24" height="5" rx="1.5" fill="#16302b"/>
  <rect x="7" y="6" width="4" height="1.6" rx="0.8" fill="#f7f5f0"/>
  <rect x="14" y="6" width="4" height="1.6" rx="0.8" fill="#f7f5f0"/>
  <rect x="21" y="6" width="4" height="1.6" rx="0.8" fill="#f7f5f0"/>

  <!-- Calendar grid dots: measured days -->
  <g fill="#8ba39e">
    <rect x="7"  y="12" width="2.6" height="2.6" rx="0.6"/>
    <rect x="12" y="12" width="2.6" height="2.6" rx="0.6"/>
    <rect x="22.4" y="12" width="2.6" height="2.6" rx="0.6"/>
    <rect x="7"  y="17" width="2.6" height="2.6" rx="0.6"/>
    <rect x="22.4" y="17" width="2.6" height="2.6" rx="0.6"/>
  </g>

  <!-- The daymark: a rust beacon triangle marking today, standing on its ink baseline -->
  <path d="M16 11.2 L20.4 20.4 H11.6 Z" fill="#b3491d"/>
  <rect x="6" y="21.6" width="20" height="2.2" rx="1.1" fill="#16302b"/>
</svg>
