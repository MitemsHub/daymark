name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # contents: write lets the gh-pages publish step create and push the branch
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Smoke test a built site (upload fixtures, run call-over)
        # Builds the real site (same command the Pages build runs) and drives
        # it with a browser: fixture CSVs go in, tiles and the Show-all/Hide
        # toggle must come out right. Catches upload/results regressions
        # before anything publishes.
        run: |
          npm run build
          touch e2e/.smoke-env
          npx playwright install --with-deps chromium
          PW_SERVER_COMMAND="npx next start -p 3000" npx playwright test
          rm e2e/.smoke-env
      - name: Build static site
        run: npm run build:pages
      - name: Publish gh-pages branch (branch-mode safety net)
        # The Pages source setting keeps flipping back to "Deploy from a
        # branch". A gh-pages branch is the branch that setting expects, so
        # branch mode serves this exact build instead of a Jekyll README.
        if: ${{ !cancelled() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
          force_orphan: true
          keep_files: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: ${{ github.event.head_commit.message }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
